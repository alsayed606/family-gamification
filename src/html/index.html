<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>نظام العائلة التفاعلي 🎮</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
  <div id="toast-stack" class="toast-stack"></div>

  <!-- شاشة الدخول -->
  <section id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="login-logo">
        <span class="logo-emoji">🎮</span>
        <h1>نظام العائلة</h1>
        <p class="muted">اختر شخصيتك للدخول</p>
      </div>
      <div id="login-avatars" class="login-avatars">
        <div class="skeleton-grid">
          <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        </div>
      </div>
      <!-- أُزيل زر "دخول الإدارة" في المرحلة 0 (باب خلفي برمز مكتوب في الكود).
           يعود في المرحلة 1 عبر Firebase Auth. -->
    </div>
  </section>

  <!-- شاشة اختيار اللعبة (Game Hub) -->
  <section id="screen-hub" class="screen">
    <header class="topbar">
      <div class="tb-user">
        <span id="hub-avatar" class="tb-avatar">🙂</span>
        <div>
          <strong id="hub-name">—</strong>
          <small class="muted">اختر لعبة للبدء</small>
        </div>
      </div>
      <div class="tb-coins">
        <button id="btn-hub-admin" class="btn-ghost" hidden>
          <i class="fa-solid fa-shield-halved"></i> لوحة التحكم
        </button>
        <button id="btn-hub-logout" class="btn-ghost">
          <i class="fa-solid fa-sign-out-alt"></i>
        </button>
      </div>
    </header>
    <div class="hub-wrap">
      <div class="section-title">🎮 الألعاب</div>
      <div id="hub-grid" class="hub-grid"></div>
    </div>
  </section>

  <!-- نافذة PIN -->
  <div id="pin-modal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="pin-title">أدخل الرمز</h3>
      <div id="pin-dots" class="pin-dots"></div>
      <div class="pin-pad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button data-act="clear"><i class="fa-solid fa-delete-left"></i></button>
        <button>0</button>
        <button data-act="ok"><i class="fa-solid fa-check"></i></button>
      </div>
      <button class="btn-ghost" data-act="close-pin">إلغاء</button>
    </div>
  </div>

  <!-- التطبيق -->
  <main id="app-shell" hidden>
    <header class="topbar">
      <div class="tb-user">
        <button id="btn-hub" class="icon-btn" title="الألعاب">
          <i class="fa-solid fa-house"></i>
        </button>
        <span id="tb-avatar" class="tb-avatar">🙂</span>
        <div>
          <strong id="tb-name">—</strong>
          <small id="tb-rank" class="muted">المستوى 1</small>
        </div>
      </div>
      <div class="tb-coins">
        <span class="chip"><i class="fa-solid fa-coins"></i> <b id="tb-coins">0</b></span>
        <span class="chip gem"><i class="fa-solid fa-gem"></i> <b id="tb-gems">0</b></span>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-tasks" class="view"></section>
    <section id="view-leaderboard" class="view"></section>
    <section id="view-shop" class="view"></section>
    <section id="view-admin" class="view"></section>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="dashboard"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
      <button class="nav-btn" data-view="tasks"><i class="fa-solid fa-list-check"></i><span>المهام</span></button>
      <button class="nav-btn" data-view="leaderboard"><i class="fa-solid fa-ranking-star"></i><span>الترتيب</span></button>
      <button class="nav-btn" data-view="shop"><i class="fa-solid fa-store"></i><span>المتجر</span></button>
      <button class="nav-btn" data-view="admin" id="nav-admin" hidden><i class="fa-solid fa-gear"></i><span>الإدارة</span></button>
    </nav>
  </main>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>

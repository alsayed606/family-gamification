<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تهيئة البيانات الأولية — seed</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0a0e1a;color:#e8edf7;
      max-width:560px;margin:40px auto;padding:0 16px;line-height:1.8}
    button{background:#00e5ff;color:#06121a;border:0;border-radius:10px;
      padding:12px 18px;font-weight:800;cursor:pointer;font-size:16px}
    pre{background:#111726;padding:14px;border-radius:10px;white-space:pre-wrap;
      border:1px solid #ffffff22}
    .ok{color:#36e07f}.err{color:#ff5470}
  </style>
</head>
<body>
  <h2>🌱 تهيئة البيانات الأولية</h2>
  <p>شغّل هذا الملف <b>مرة واحدة فقط</b> لإنشاء أفراد العائلة التجريبيين.
     بعدها احذفه أو لا ترفعه للإنتاج.</p>
  <button id="run">إنشاء البيانات الآن</button>
  <pre id="log">جاهز…</pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      addDoc,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCW-9S1RLNnIa12oAdikFSKg4Y4Bpsl7os",
      authDomain: "marine-command-center.firebaseapp.com",
      projectId: "marine-command-center",
      storageBucket: "marine-command-center.firebasestorage.app",
      messagingSenderId: "781767817474",
      appId: "1:781767817474:web:4a965e8b21cbfdd1dbaa1b",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const COLLECTIONS = {
      users: "fam_users",
      tasks: "fam_tasks",
      seasons: "fam_seasons",
    };

    const log = (m, cls="") => {
      const el = document.getElementById("log");
      el.innerHTML += `\n<span class="${cls}">${m}</span>`;
    };

    document.getElementById("run").addEventListener("click", async () => {
      try {
        const members = [
          { id:"u_dad",  name:"الأب",   avatar:"👨", pin:"",     role:"admin", level:1, xp:0, coins:50, gems:2, frozen:0, streak:0, rank:"عضو" },
          { id:"u_mom",  name:"الأم",   avatar:"👩", pin:"",     role:"user",  level:1, xp:0, coins:50, gems:2, frozen:0, streak:0, rank:"عضو" },
          { id:"u_kid1", name:"سارة",   avatar:"👧", pin:"1111", role:"user",  level:1, xp:0, coins:20, gems:0, frozen:0, streak:0, rank:"عضو" },
          { id:"u_kid2", name:"خالد",   avatar:"👦", pin:"2222", role:"user",  level:1, xp:0, coins:20, gems:0, frozen:0, streak:0, rank:"عضو" },
        ];

        for (const m of members) {
          await setDoc(doc(db, COLLECTIONS.users, m.id), m);
          log(`✓ أُنشئ: ${m.name}`, "ok");
        }

        await addDoc(collection(db, COLLECTIONS.tasks), {
          name:"ترتيب الغرفة",
          desc:"رتّب غرفتك بالكامل قبل المساء",
          xp:50,
          coins:10,
          gems:0,
          difficulty:"easy",
          type:"daily",
          icon:"🧹",
          active:true,
          createdAt: serverTimestamp(),
        });
        log("✓ أُنشئت مهمة عيّنة", "ok");

        await setDoc(doc(db, COLLECTIONS.seasons, "summer_2026"), {
          name:"صيف 2026",
          active:true,
          start:"2026-06-01",
          end:"2026-08-31",
          banner:"☀️",
        });
        log("✓ أُنشئ موسم: صيف 2026", "ok");

        log("\n🎉 تم! افتح التطبيق الآن.", "ok");
      } catch (e) {
        log("✗ خطأ: " + e.message, "err");
        log("تأكد من تفعيل Firestore و Rules الصحيحة.", "err");
      }
    });
  </script>
</body>
</html>
